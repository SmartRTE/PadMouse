name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请尽量附上 App 内「调试 → 导出诊断文件」得到的 padprobe.txt。
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 期望发生什么 / 实际发生了什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好（哪个 App、按了什么键、推杆幅度多少）
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与 Android 版本
      placeholder: 例如 Xiaomi M332BF / Android 16
    validations:
      required: true
  - type: input
    id: pad
    attributes:
      label: 手柄型号与连接方式
      placeholder: 例如 GameSir Nova 2 Lite / 蓝牙
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 诊断文件
      description: 可把 padprobe.txt 内容粘贴到这里
